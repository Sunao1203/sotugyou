<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Three.js GLB Loader Test</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <button>TMP</button>
    <!-- Three.jsとGLTFLoaderをCDNから読み込む -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. 基本の3要素の準備
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xefefef); // 背景を薄いグレーに

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5); // カメラの位置を少し斜め上に

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. 光源の追加（これがないとBlenderのマテリアルが真っ暗になります）
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); // 環境光
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0); // 平行光源
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // 3. GLTFLoaderを使って自作の .glb を読み込む
        const loader = new GLTFLoader();

        function createmodel(){
        // ※ Blenderから書き出した .glb ファイルと同じ階層に配置してください
        loader.load('human1.glb', (gltf) => {

            const model = gltf.scene;
            scene.add(model); // ← あなたの考え通り、ここでシーンに追加！

            
            for(let i = 0;i < model.children.length;i++){
                if(model.children[i].name == "righteye"){
                    const modelrighteye = model.children[i];
                }
                if(model.children[i].name =- "lefteye"){
                    const modelleftrye = model.children[i];
                }

            }

            console.log('モデルの読み込みに成功しました！');
            model.position.set(0, 1.5, 3.5);
        }, (xhr) => {
            // 読み込み中の進捗を表示（なくてもOK）
            console.log((xhr.loaded / xhr.total * 100) + '% loaded');
        }, (error) => {
            // エラー時の処理
            console.error('エラーが発生しました:', error);
        });
        }
        createmodel();
        

       // 4. アニメーションループ（画面を毎フレーム更新する）
        function animate() {
            requestAnimationFrame(animate);

            // シーンとカメラを使って描画する
            renderer.render(scene, camera);
        }
        animate(); // アニメーションループを開始
        

        // 5. ウィンドウサイズ変更への対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
